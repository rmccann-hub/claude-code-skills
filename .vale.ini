# The house-style skill's Vale style, from its source in this repository. Other repositories
# name the release's HouseStyle.zip instead, as the skill's setup reference shows.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = skills/house-style/assets/vale/HouseStyle
Vocab = Repository

[*.md]
BasedOnStyles = HouseStyle

# Append-only records and dated research keep their past entries as written.
[docs/decisions.md]
BasedOnStyles =

[research/{runs,prompts}/*.md]
BasedOnStyles =

# Parity samples stand in for other repositories' text.
[tests/fixtures/**/*.md]
BasedOnStyles =

# Quotes from sources keep their own words and spelling.
[skills/*/references/{facts,sources}.md]
TokenIgnores = "(?:[^"\\]|\\.)*"
