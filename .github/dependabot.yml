version: 2
updates:
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
