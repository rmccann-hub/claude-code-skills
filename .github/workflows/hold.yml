name: Hold

# A live hold on a pull request: the owner adds the `hold` label, and this check fails until it
# comes off. As a required check it stops every merge path, auto-merge and a session's merge
# alike, which a hold sent as a message can't. The steward skill names it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A newer label event or push makes the last answer stale, so it stops.
concurrency:
  group: hold-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read # to read the labels as they are now
    steps:
      # The labels are read live, not from the event: a re-run reuses its original event, so an
      # old passing run re-run after the label went on would otherwise lift the hold.
      - name: Fail while the pull request carries the hold label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')
          if grep -qx hold <<<"$labels"; then
            echo "::error::This pull request is on hold. The owner removes the hold label to lift it."
            exit 1
          fi
          echo "No hold on this pull request."
