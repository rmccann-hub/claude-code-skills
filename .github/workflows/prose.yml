name: Prose

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push makes a pull request's last answer stale, so that run stops. Runs on a branch finish.
concurrency:
  group: prose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: v3.24.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Install Vale (module checksums verified against sum.golang.org)
        run: go install "github.com/vale-cli/vale/v3/cmd/vale@${VALE_VERSION}"

      - name: Fetch the house style named in .vale.ini
        run: '"$(go env GOPATH)/bin/vale" sync'

      - name: Prove the style catches each kind of mistake
        run: |
          # Written outside the repository, so it can never be committed by mistake.
          canary="$RUNNER_TEMP/canary.md"
          printf '# Title Case Heading\n\nThis is just the colour.\n' > "$canary"
          status=0
          found=$("$(go env GOPATH)/bin/vale" --output line "$canary") || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::Vale exited $status on the canary, not 1"
            exit 1
          fi
          for rule in Headings Filler Spelling; do
            if ! grep -q "HouseStyle.$rule" <<< "$found"; then
              echo "::error::HouseStyle.$rule let the canary through"
              exit 1
            fi
          done

      - name: Check the prose
        # bash, not the default, so a failure anywhere in the pipe fails the step.
        shell: bash
        run: |
          echo "checking $(git ls-files '*.md' | wc -l) Markdown file(s)"
          git ls-files -z '*.md' | xargs -0 -r "$(go env GOPATH)/bin/vale"
