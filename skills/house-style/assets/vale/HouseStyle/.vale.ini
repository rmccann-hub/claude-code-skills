[*.md]
BasedOnStyles = HouseStyle
# Words in double quotes keep their source's spelling, so the check skips them. A quote may wrap
# across lines, but never past its paragraph, nor onto a line that opens a bullet, heading,
# block quote, table row or code fence, so a stray mark can't hide the prose after it.
TokenIgnores = "(?:[^"\\\n]|\\.)*(?:\n[^\S\n]*[^-"\\\s#>|`~*+](?:[^"\\\n]|\\.)*)*"
