[*.md]
BasedOnStyles = HouseStyle
# Words in double quotes keep their source's spelling, so the check skips them. A quote opens
# only after a space, a line's start or punctuation, not after a letter, a digit or a backtick,
# so an inch mark such as 5" opens none. It may wrap, but never past its paragraph, nor onto a
# line that opens a list item, heading, block quote, table row or code fence.
TokenIgnores = (?:^|[^0-9A-Za-z_"\\`])("(?:[^"\\\n]|\\.)*(?:\n[^\S\n]*(?:[^-"\\\s#>|`~*+0-9]|[0-9]+(?:[^.)0-9"\\\n]|[.)][^\s"\\]))(?:[^"\\\n]|\\.)*)*")
