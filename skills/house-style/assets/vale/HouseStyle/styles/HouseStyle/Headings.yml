# Rule 8: sentence-case headings. A repository adds its own proper nouns to its vocabulary.
extends: capitalization
message: "Use sentence case for '%s'."
level: error
scope: heading
match: $sentence
indicators:
  - ":"
  - "."
exceptions:
  - AI
  - API
  - APIs
  - Anthropic
  - CI
  - CLI
  - Claude
  - Claude Code
  - CodeQL
  - Dependabot
  - Docker
  - GUI
  - Git
  - GitHub
  - GitHub Actions
  - HTML
  - JSON
  - JavaScript
  - KDE
  - Keep a Changelog
  - Linux
  - MCP
  - Markdown
  - Node.js
  - OIDC
  - PowerShell
  - PyPI
  - Python
  - README
  - Rust
  - SHA
  - SHA-256
  - SQL
  - Semantic Versioning
  - TODO
  - TODOs
  - TOML
  - TypeScript
  - URL
  - URLs
  - Vale
  - Windows
  - XML
  - YAML
  - macOS
