name: Release

# Makes an annotated release tag on one commit, named by its SHA, once that commit is on the
# default branch, its CHANGELOG.md has the version's section, a branch has its workflow files,
# and every check on it has passed. A run that fails after the tag is pushed can be run again.
# Run it from the Actions tab, or: gh workflow run release.yml -f version=1.4.0 -f sha=<SHA>

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 1.4.0 or 1.4.0-rc.1"
        required: true
      sha:
        description: "Full SHA of the commit to tag"
        required: true

permissions:
  contents: read

# Two releases at once would race for the tag and the changelog, so they queue.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Named in OWN_JOBS below, with every other job in this workflow.
    name: Release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the tag
      checks: read # to read the commit's check runs
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Every job in this workflow, by name, separated by commas. Their runs are checks on the
      # commit too, and an earlier attempt that failed mustn't stop the next one.
      OWN_JOBS: Release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version, the commit and its changelog
        run: |
          # A Semantic Versioning version, with an optional pre-release label such as -rc.1.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! $VERSION =~ $semver ]]; then
            echo "::error::not a version: $VERSION"; exit 1
          fi
          if [[ ! $SHA =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::not a full commit SHA: $SHA"; exit 1
          fi
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "::error::no commit $SHA in this repository"; exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$SHA is not on $DEFAULT_BRANCH"; exit 1
          fi
          if ! git show "$SHA:CHANGELOG.md" | grep -qF "## [$VERSION]"; then
            echo "::error::CHANGELOG.md at $SHA has no section for $VERSION"; exit 1
          fi

      - name: Check that a branch has the commit's workflow files
        run: |
          # This job's token can't be given the workflows permission, and without it GitHub
          # refuses a ref whose commit carries a workflow file that no branch has with the same
          # path and contents (fact `workflow-scope`). An older commit does, once a later one
          # changes a workflow, so that's said here, before anything is made.
          listing=$(git ls-tree -r --format='%(objectname) %(path)' "$SHA" -- .github/workflows)
          branches=$(git for-each-ref --format='%(refname)' refs/remotes/origin)
          missing=""
          while read -r blob path; do
            [ -n "$blob" ] || continue
            found=no
            while read -r branch; do
              if [ "$(git rev-parse -q --verify "$branch:$path" || true)" = "$blob" ]; then
                found=yes
                break
              fi
            done <<< "$branches"
            if [ "$found" = no ]; then
              missing="$missing $path"
            fi
          done <<< "$listing"
          if [ -n "$missing" ]; then
            echo "::error::no branch has these workflow files as $SHA has them, so GitHub would refuse its tag:$missing"
            echo "Tag a release before a later commit changes its workflows, or have someone whose token has the workflows permission make the tag."
            exit 1
          fi

      - name: Check that every check on the commit has passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This workflow's own runs are checks on the commit too: this one, and any earlier
          # attempt, which may have failed. So every run of a job named in OWN_JOBS is left out.
          # A commit with no checks at all fails: a gate that read nothing has proved nothing. CI
          # that reports commit statuses instead of check runs needs .../commits/$SHA/status too.
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name as $job | $ENV.OWN_JOBS // "" | split(",") | any(. == $job) | not) | "\(.conclusion) \(.name)"')
          if [ -z "$runs" ]; then
            echo "::error::no checks have run on $SHA"; exit 1
          fi
          # A check still running has no conclusion yet, which jq prints as null.
          if failed=$(printf '%s\n' "$runs" | grep -Ev '^(success|skipped|neutral) '); then
            printf '::error::not every check on %s has passed:\n%s\n' "$SHA" "$failed"; exit 1
          fi
          echo "$(printf '%s\n' "$runs" | wc -l) check(s) passed on $SHA"

      - name: Make the annotated tag and push it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An attempt that failed after pushing the tag leaves it there. Running again carries
          # on only if it's the tag this run would make.
          if existing=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}"); then
            if [ "$existing" = "$SHA" ] && [ "$(git cat-file -t "v$VERSION")" = tag ]; then
              echo "v$VERSION is already an annotated tag on $SHA"
              exit 0
            fi
            echo "::error::v$VERSION already exists, and isn't an annotated tag on $SHA"; exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "v$VERSION" -m "Release $VERSION" "$SHA"
          test "$(git cat-file -t "v$VERSION")" = tag
          # Checkout kept no credentials, so the push gets them here: through the environment,
          # not the command line, and masked in case anything prints them.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "refs/tags/v$VERSION"
