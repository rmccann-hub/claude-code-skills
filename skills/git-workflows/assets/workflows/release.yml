name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 1.4.0"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job pushes a tag, so it keeps checkout's default credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Make an annotated tag on the checked-out commit and push it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            "" | *[!0-9.]*) echo "::error::not a version: $VERSION"; exit 1 ;;
          esac
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "v$VERSION" -m "Release $VERSION"
          test "$(git cat-file -t "v$VERSION")" = tag
          git push origin "refs/tags/v$VERSION"
