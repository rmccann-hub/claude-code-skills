name: Tests

# Runs the test suite, then proves it ran to the end. A run that stops early can still exit 0,
# so the job fails unless pytest wrote its report and the report counts at least as many tests
# as .test-baseline records. Raise the baseline in the change that adds tests.

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

# A new push to a pull request makes its last run stale. A run on a branch finishes.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install from the lockfile, failing on drift
        run: uv sync --locked

      - name: Test
        run: uv run pytest --junitxml="$RUNNER_TEMP/junit.xml"

      - name: Prove the suite ran to the end
        run: |
          python3 - "$RUNNER_TEMP/junit.xml" "$(cat .test-baseline)" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report, baseline = Path(sys.argv[1]), int(sys.argv[2])
          if not report.is_file():
              print("::error::completion guard: the test run wrote no report, so it did not finish")
              sys.exit(1)
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          ran = sum(int(suite.get("tests", 0)) for suite in suites)
          print(f"the report counts {ran} tests, baseline {baseline}")
          if ran < baseline:
              print(f"::error::completion guard: {ran} tests reported, below the baseline of {baseline}")
              sys.exit(1)
          EOF
