  - PowerShell
  # What invokes it decides the shape: a schedule makes it a scheduled job.
  - scheduled job
not_proposed: []
manual:
  - The recommendation names a runner-up and what each costs, and leaves the choice to the person
  - Nothing was generated, in the sample repository or anywhere else
