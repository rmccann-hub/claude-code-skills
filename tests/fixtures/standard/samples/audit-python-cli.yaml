      src/tallyho/__init__.py: |
        """Counts the values in one column of a CSV file."""
      src/tallyho/core.py: |
        import csv
        from collections import Counter
        from pathlib import Path


        def tally(path: Path, column: str) -> Counter[str]:
            with path.open(newline="", encoding="utf-8") as handle:
                return Counter(row[column] for row in csv.DictReader(handle))
      src/tallyho/cli.py: |
        from pathlib import Path

        import click

        from tallyho.core import tally


        @click.command()
        @click.argument("path", type=click.Path(exists=True, path_type=Path))
        @click.option("--column", required=True)
        def main(path: Path, column: str) -> None:
            for value, count in tally(path, column).most_common():
                click.echo(f"{count}\t{value}")
      tests/test_core.py: |
        from tallyho.core import tally


        def test_counts_each_value(tmp_path):
            data = tmp_path / "data.csv"
            data.write_text("status\nopen\nclosed\nopen\n", encoding="utf-8")
            assert tally(data, "status") == {"open": 2, "closed": 1}


        def test_empty_file_counts_nothing(tmp_path):
            data = tmp_path / "data.csv"
            data.write_text("status\n", encoding="utf-8")
            assert tally(data, "status") == {}
      AGENTS.md: |
