    author: Fixture Author <author@example.com>
    date: "2026-05-04T09:00:00+00:00"
    files:
      README.md: |
        # tallyho

        Counts the values in one column of a CSV file.

        Current version: 0.3.0.

        ## Install

            pip install -e .

        ## Usage

            tallyho data.csv --column status

        ## Development

            pip install -e ".[test]"
            pytest
      pyproject.toml: |
