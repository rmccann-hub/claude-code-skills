[project]
name = "skillcheck"
# Never released on its own. The repository's version lives in CHANGELOG.md and the catalog.
version = "0.0.0"
description = "Checks for this repository's skills and plugin catalog."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
skillcheck = "skillcheck.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.8"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=skillcheck",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
# This repository's own code only. Ruff also formats code blocks in Markdown, and a skill's
# examples and bundled scripts are reviewed on import, not rewritten by a formatter.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
